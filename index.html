<!doctype html>
<!-- BTC DESK neon dashboard v6 "night-shift / chief" restyle (matches Reed's 5th X post reference).
     Vanilla JS/CSS/canvas, no CDNs. Polls /api/neon?desk=5m|15m every 1.5s.
     RULE: every labeled number comes from the API (or is '—'). Motion (bezier lines, particles,
     spine dots, mascots) is decorative only. Conveyor items are spawned from real API changes. -->
<html><head><meta charset="utf-8"><title>GROK BOT / CHIEF · btc desk</title>
<style>
:root{--bg:#0d0d14;--pn:#14141f;--ti:#2a2560;--tr:#8a2f45;--tx:#d8d8e8;--mu:#6b6b85;--te:#3fd6b8;--pu:#8b7bff;--pk:#ff5c8a;--go:#ffcf5c;--gr:#5ce0a0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:11px/1.35 "JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace}
/* ---- top status bar ---- */
#top{display:flex;align-items:center;height:26px;padding:0 10px;border-bottom:1px solid #1d1d2b;gap:14px;color:var(--mu)}
#top b{color:#fff}#top .lv{color:var(--te)}#top .mid{flex:1;text-align:center;color:#fff;letter-spacing:1px;font-weight:700}
.tg button{background:none;border:1px solid #2a2a3d;color:var(--mu);font:inherit;padding:0 6px;cursor:pointer}.tg button.on{color:#fff;background:var(--ti)}
/* ---- desk stage ---- */
.desk{position:relative;padding:6px 10px}
.stage{position:relative;height:640px}
.stage canvas.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.left{position:absolute;left:0;top:0;width:190px;display:flex;flex-direction:column;gap:12px}
.belt{position:absolute;left:208px;top:0;width:18px;height:600px;border-left:1px dashed #2a2a3d;border-right:1px dashed #2a2a3d;
 background:repeating-linear-gradient(0deg,transparent 0 10px,#1a1a28 10px 12px);background-size:100% 12px;animation:belt 1s linear infinite;overflow:visible;clip-path:inset(0 -40px 0 -40px)}
@keyframes belt{to{background-position:0 12px}}
.chip{position:absolute;left:-14px;width:46px;font-size:8px;padding:1px 2px;border-radius:2px;text-align:center;color:#0d0d14;font-weight:700;white-space:nowrap;overflow:hidden;transition:opacity .3s}
.spine{position:absolute;left:230px;top:0;width:28px;height:600px;clip-path:inset(0 -40px 0 -40px);background:#11111b;border:1px solid #1d1d2b}
.spine .tick{position:absolute;left:2px;font-size:7px;color:#3a3a55}.spine .cur{position:absolute;left:4px;width:18px;height:6px;background:var(--pu)}
.tag{position:absolute;font-size:8px;background:#5a1f2e;color:#ffb3c4;padding:0 2px;border-radius:2px}
.right{position:absolute;left:330px;right:0;top:0;height:600px}
/* ---- panels ---- */
.pn{background:var(--pn);border:1px solid #23233a;position:relative}
.pn .t{background:var(--ti);color:#fff;font-weight:700;padding:2px 6px;display:flex;justify-content:space-between}.pn .t i{font-style:normal;color:#aaa}
.pn.act .t{background:var(--tr)}.pn.act{border-color:#8a2f45}
.pn .b{padding:4px 6px}.r{display:flex;justify-content:space-between;padding:1px 2px}.r span:first-child{color:var(--mu)}.r.sel{background:#1f2a3a;color:#fff}
.pn.dim{opacity:.35}.bet{padding:3px 2px;border-top:1px solid rgba(255,255,255,.08)}.bet .pl{white-space:normal;overflow-wrap:anywhere;font-size:.92em;line-height:1.25}.betw{max-height:170px;overflow-y:auto;overflow-x:hidden}.bet .b{color:#fff}.bet .cd{white-space:normal;font-variant-numeric:tabular-nums;color:var(--go)}.bet .cd.ok{color:#3dff9a}.bet .cd.bad{color:#ff4d6d}.bet .cd.st{color:#ffcf5c}.lg{font-size:.78em;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help;padding-top:2px}.cdr{display:flex;justify-content:space-between;gap:6px;padding:1px 2px;white-space:nowrap;overflow:hidden}.cdr .cd{color:var(--go);font-variant-numeric:tabular-nums}.cdr .cd.st{color:#ffcf5c}.cdr span{overflow:hidden;text-overflow:ellipsis}.tm{min-width:0;overflow:hidden}.rg{flex:0 0 auto}.tr2{gap:4px;min-width:0}.tile .pch{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}.gap{flex:0 0 auto}@media(max-width:480px){.tile .pch{font-size:.7em}}.tile{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;align-items:center;gap:6px;padding:3px 4px;margin:3px 0;border:1px solid rgba(255,255,255,.1);border-radius:6px;position:relative;border-top:1px solid rgba(255,255,255,.1)}.tile.winning{border-color:rgba(61,255,154,.45)}.tile.losing{border-color:rgba(255,77,109,.45)}.tc{display:flex;flex-direction:column;align-items:center;line-height:1}.ar{font-size:20px}.ar.ok{color:#3dff9a}.ar.bad{color:#ff4d6d}.ar.lk{font-size:17px}.tw{font-size:.8em;opacity:.75;margin-top:1px}.tb{position:relative;height:8px;background:rgba(255,255,255,.08);border-radius:4px}.tb i{position:absolute;top:0;bottom:0}.tb .ctr{left:50%;width:1px;background:rgba(255,255,255,.6);top:-2px;bottom:-2px}.tb .fl{border-radius:4px}.tb .fl.ok{background:#3dff9a}.tb .fl.bad{background:#ff4d6d}.tb .mk{width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}.tr2{display:flex;justify-content:space-between;align-items:center;margin-top:3px;white-space:nowrap}.gap{font-size:1.05em;font-variant-numeric:tabular-nums}.gap.ok,.bdg.ok{color:#3dff9a}.gap.bad,.bdg.bad{color:#ff4d6d}.tile .pch{display:inline-block;max-width:100%;font-size:.78em;padding:0 5px;border-radius:8px;background:rgba(255,255,255,.12);color:#e6e8ff!important;opacity:1!important;visibility:visible!important;position:static!important}.lkb{font-size:1.1em;color:#3dff9a;text-align:center}.rg{position:relative;width:36px;height:36px}.rg svg{width:36px;height:36px}.rb{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3}.rf{fill:none;stroke:var(--go);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset 1s linear}.rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72em;font-variant-numeric:tabular-nums}.tile.wait .rf{stroke:#ffcf5c}.tile.wait .rb{stroke:rgba(160,160,175,.28);stroke-width:2}.tile.wait .rt{animation:pls 1.4s ease-in-out infinite;color:#ffcf5c}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pls{50%{opacity:.4}}.bdg{position:absolute;top:1px;right:46px;font-size:.72em;font-weight:700}.bdg.big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.3em;background:#0b0f14;z-index:2;border-radius:6px;animation:glw 1s ease-in-out 4}@keyframes glw{50%{text-shadow:0 0 12px currentColor}}.betw.cmp .tile{grid-template-columns:34px minmax(0,1fr) 32px;padding:1px 3px;margin:2px 0}.betw.cmp .ar{font-size:15px}.betw.cmp .rg,.betw.cmp .rg svg{width:28px;height:28px}.betw.cmp .pch{display:none}.betw.cmp .rt{font-size:.62em}.betw{max-height:none!important;overflow:hidden!important}.ti{cursor:help;opacity:.6;font-size:.9em;float:right;margin-top:-2px}.pn.flash{box-shadow:0 0 0 2px var(--te),0 0 18px var(--te)}
.fl{position:absolute;width:230px}
.blocks{display:flex;gap:2px;margin-top:4px}.blocks span{flex:1;height:10px;background:#23233a}.blocks .w{background:var(--pu)}.blocks .l{background:var(--pk)}
.mini{display:block;width:100%;height:26px;margin-top:4px}
.badge{padding:0 5px;font-weight:700}.SKIP{background:#33334a;color:#aab}.CANDIDATE{background:var(--pu);color:#fff}
.sub{border:1px solid #2a2a45;margin-top:5px;padding:3px}.sub .h{color:var(--pu);font-size:9px;display:flex;justify-content:space-between}
.cap{position:absolute;left:260px;top:606px;color:#fff;font-weight:700;font-size:13px;letter-spacing:1px}.cap small{display:block;color:var(--mu);font-weight:400;font-size:10px;letter-spacing:0}
/* TOTAL box (kept from v5; per-desk, never combined) */
.tot{position:absolute;right:0;top:604px;display:flex;gap:10px;align-items:baseline;border:1px solid #3a3360;padding:2px 10px;background:#12121c}
.tot .tl{color:var(--go);font-weight:700;letter-spacing:2px}.tot .tv{font-size:22px;font-weight:700}.pos{color:var(--gr)}.neg{color:var(--pk)}.tot .ts{color:var(--mu);font-size:9px}
/* ---- footer ---- */
.foot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:6px}
.foot .pn{background:#101019}.foot .t{background:none;border-bottom:1px solid #23233a;color:#ccc}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log b{display:inline-block;width:44px;margin-right:4px;font-weight:400}.log b+b{width:74px}
.ok{color:var(--gr)}.bad{color:var(--pk)}.info{color:var(--te)}.dim{color:var(--mu)}
.seg{display:inline-flex;gap:1px;vertical-align:middle}.seg span{width:3px;height:9px;background:#2a2a45}.seg span.f{background:#c8c0ff}
.big{font-size:44px;font-weight:700;color:#fff;line-height:1}
.pbar{display:flex;gap:2px;margin-top:4px}.pbar span{flex:1;height:8px;background:#23233a}.pbar span.f{background:var(--pu)}
#cmd{display:flex;justify-content:space-between;padding:4px 10px;border-top:1px solid #1d1d2b;color:var(--mu)}#cmd .cu{display:inline-block;width:7px;height:12px;background:var(--pu);animation:bl 1s steps(1) infinite;vertical-align:middle}
@keyframes bl{50%{opacity:0}}
/* mascots: pure CSS pixel blobs */
.blob{position:absolute;width:20px;height:16px;border-radius:9px 9px 5px 5px;z-index:5;pointer-events:none}
.blob:before,.blob:after{content:"";position:absolute;top:5px;width:3px;height:4px;background:#0d0d14}.blob:before{left:5px}.blob:after{right:5px}
.carrier{transition:left 1.1s ease-in-out,top 1.1s ease-in-out}.carrier .chip{left:14px;top:-6px}
.blob.mascot{position:relative;display:inline-block;width:14px;height:11px;margin-left:auto;margin-right:6px;z-index:1}.blob.mascot:before,.blob.mascot:after{top:3px;width:2px;height:3px}.blob.mascot:before{left:3px}.blob.mascot:after{right:3px}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
/* v7: simple 'both' comparison view (no fan lines/conveyor/dense panels) */
body.both #desks{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;padding:16px;max-width:1400px;margin:0 auto}
.cmp{background:#14141f;border:1px solid #2a2a45;padding:16px;font-size:13px}.cmp h2{margin:0 0 10px;color:#fff;font-size:15px;letter-spacing:2px;background:#2a2560;padding:4px 10px}
.cmp .ctot{font-size:40px;font-weight:700;margin:4px 0 2px}.cmp .lbl{color:var(--go);letter-spacing:2px;font-weight:700}
.cmp .r{padding:4px 2px;border-bottom:1px solid #1d1d2b}.cmp .sec{color:var(--pu);margin:12px 0 4px;font-size:11px;letter-spacing:1px}
</style></head><body>
<div id="top"><span>GRAPH <b id="gname">chief-night-01</b></span><span>NODES <b id="nN">—</b></span><span>EDGES <b id="nE">—</b></span><span>WORKERS <b id="nW">—</b></span><span class="lv">\ LIVE</span>

<script>
// ---------- helpers ----------
const D='—',$=(e,c)=>e.querySelector('.x-'+c),set=(e,c,v)=>{const n=$(e,c);if(n)n.textContent=v==null?D:v};
const f=(x,n=2)=>x==null||isNaN(x)?D:(+x).toFixed(n),money=x=>x==null?D:(x>=0?'+$':'-$')+Math.abs(x).toFixed(2);
const ct=t=>new Date(t*1000).toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour12:false,hour:'2-digit',minute:'2-digit'});
let mode=localStorage.neonMode||'5m',frames=0;const desks={};
const MASCOT={tracker:'#3fd6b8',analyst:'#ff7ab0',predictor:'#9b7bff',risk:'#ffcf5c',your_call:'#5cb8ff',pipeline:'#ffa04a'};
const BOT_COLOR={tracker:'#3fd6b8',analyst:'#8b7bff',predictor:'#ff5c8a',risk:'#ffcf5c'};
setInterval(()=>{clock.textContent=new Date().toLocaleTimeString('en-US',{timeZone:'America/Chicago',hour12:false})+' CT'},500);
document.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;localStorage.neonMode=mode;layout()});

// ---------- build / layout ----------
function build(k){const el=tpl.content.firstElementChild.cloneNode(true);set(el,'dn',k);
  // spine: timeline ruler + decorative dots (no numbers except ruler)
  const sp=el.querySelector('.spine');for(let i=0;i<40;i++){const t=document.createElement('div');t.className='tick';t.style.top=i*15+'px';t.textContent=String(i).padStart(2,'0');sp.appendChild(t)}
  const cur=document.createElement('div');cur.className='cur';sp.appendChild(cur);
  // mascots: carrier (moves items belt->panel) + idle blobs
  const st={k,el,data:null,prev:{},lines:[],parts:[],price:[],queue:[],busy:false,cur};
  st.car=blob(el.querySelector('.stage'),'#fff',205,280,'carrier');
  // v9: one mascot per bot card, docked inside the card's title bar (was 3 blobs at fixed stage px, so tracker/risk/your_call had none and some sat off-card)
  Object.entries(MASCOT).forEach(([n,c])=>{const pn=el.querySelector('.pn[data-p="'+n+'"] .t');if(pn){const m=document.createElement('span');m.className='blob bob mascot';m.style.background=c;m.style.animationDelay=(Math.random()*1.6).toFixed(2)+'s';pn.insertBefore(m,pn.querySelector('i'))}});
  return st}
function blob(par,c,x,y,cls){const b=document.createElement('div');b.className='blob '+cls;b.style.background=c;b.style.left=x+'px';b.style.top=y+'px';par.appendChild(b);return b}
function layout(){document.querySelectorAll('.tg button').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));

    const x1=t.left?t.x+190:t.x,y1=t.y+Math.random()*Math.max(10,t.h-20);

function bz(l,t){const cx=(l.x0+l.x1)/2,u=1-t;return[u*u*u*l.x0+3*u*u*t*cx+3*u*t*t*cx+t*t*t*l.x1,u*u*u*l.y0+3*u*u*t*l.y0+3*u*t*t*l.y1+t*t*t*l.y1]}
